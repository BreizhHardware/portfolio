name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_call:
    inputs:
      environment:
        type: string
        default: recette

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment || 'recette' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_USER_ID: ${{ secrets.VITE_EMAILJS_USER_ID }}

      - name: Install Cypress binary
        run: pnpm exec cypress install

      - name: Serve build
        run: |
          pnpm exec vite preview --port 8080 --strictPort &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080 >/dev/null && exit 0
            sleep 1
          done
          echo "Preview server did not start" && exit 1

      - name: Run Cypress tests and Browserslist
        run: pnpm run test
        env:
          CYPRESS_baseUrl: http://localhost:8080

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1
