name: Deploy to server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      environment: production
    secrets: inherit

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          if [ -n "$KNOWN_HOSTS" ]; then
            echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$PORT" "$HOST" > ~/.ssh/known_hosts
          fi
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          PORT: ${{ secrets.SERVER_PORT }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}

      - name: Upload and swap webroot
        run: |
          lftp -e "
            set cmd:fail-exit yes;
            set sftp:auto-confirm no;
            set net:max-retries 3;
            open -p $PORT -u $USER,$PASS sftp://$HOST;
            rm -rf webroot-new webroot-old;
            mirror -R --parallel=4 --verbose dist webroot-new;
            mv webroot webroot-old;
            mv webroot-new webroot;
            bye"
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          PORT: ${{ secrets.SERVER_PORT }}
          USER: ${{ secrets.SERVER_USERNAME }}
          PASS: ${{ secrets.SERVER_PASSWORD }}

      - name: Smoke test
        id: smoke
        run: |
          for i in $(seq 1 10); do
            code=$(curl -sL --max-time 10 -A "$UA" -o body.html -w '%{http_code}' "$SITE_URL" || true)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ] && grep -q 'id="root"' body.html; then exit 0; fi
            sleep 3
          done
          echo "--- Last response (first 500 bytes) ---"
          head -c 500 body.html
          exit 1
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          UA: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36

      - name: Rollback on failure
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          lftp -e "
            set cmd:fail-exit yes;
            open -p $PORT -u $USER,$PASS sftp://$HOST;
            mv webroot webroot-failed;
            mv webroot-old webroot;
            rm -rf webroot-failed;
            bye"
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          PORT: ${{ secrets.SERVER_PORT }}
          USER: ${{ secrets.SERVER_USERNAME }}
          PASS: ${{ secrets.SERVER_PASSWORD }}

      - name: Remove previous version
        run: |
          lftp -e "
            set cmd:fail-exit yes;
            open -p $PORT -u $USER,$PASS sftp://$HOST;
            rm -rf webroot-old;
            bye"
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          PORT: ${{ secrets.SERVER_PORT }}
          USER: ${{ secrets.SERVER_USERNAME }}
          PASS: ${{ secrets.SERVER_PASSWORD }}
