name: Deploy to server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      environment: production
    secrets: inherit

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          if [ -n "$KNOWN_HOSTS" ]; then
            echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$PORT" "$HOST" > ~/.ssh/known_hosts
          fi
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          PORT: ${{ secrets.SERVER_PORT }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}

      - name: Upload and swap webroot
        run: |
          lftp -e "
            set cmd:fail-exit yes;
            set sftp:auto-confirm no;
            set net:max-retries 3;
            open -p $PORT -u $USER,$PASS sftp://$HOST;
            rm -rf webroot-new webroot-old;
            mirror -R --parallel=4 --verbose dist webroot-new;
            mv webroot webroot-old;
            mv webroot-new webroot;
            bye"
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          PORT: ${{ secrets.SERVER_PORT }}
          USER: ${{ secrets.SERVER_USERNAME }}
          PASS: ${{ secrets.SERVER_PASSWORD }}

      - name: Verify deployed files
        id: verify
        run: |
          lftp -e "
            set cmd:fail-exit yes;
            open -p $PORT -u $USER,$PASS sftp://$HOST;
            cat webroot/index.html > /dev/null;
            bye"
          lftp -e "
            open -p $PORT -u $USER,$PASS sftp://$HOST;
            cat webroot/index.html;
            bye" | grep -q 'id="root"'
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          PORT: ${{ secrets.SERVER_PORT }}
          USER: ${{ secrets.SERVER_USERNAME }}
          PASS: ${{ secrets.SERVER_PASSWORD }}

      - name: Public URL check (informational)
        continue-on-error: true
        run: |
          code=$(curl -sL --max-time 10 -A "$UA" -o /dev/null -w '%{http_code}' "$SITE_URL" || true)
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Public URL returned HTTP $code (Cloudflare may challenge GitHub runners)"
          fi
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          UA: github-action-breizhhardware-ci

      - name: Rollback on failure
        if: failure() && steps.verify.outcome == 'failure'
        run: |
          lftp -e "
            set cmd:fail-exit yes;
            open -p $PORT -u $USER,$PASS sftp://$HOST;
            mv webroot webroot-failed;
            mv webroot-old webroot;
            rm -rf webroot-failed;
            bye"
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          PORT: ${{ secrets.SERVER_PORT }}
          USER: ${{ secrets.SERVER_USERNAME }}
          PASS: ${{ secrets.SERVER_PASSWORD }}

      - name: Remove previous version
        run: |
          lftp -e "
            set cmd:fail-exit yes;
            open -p $PORT -u $USER,$PASS sftp://$HOST;
            rm -rf webroot-old;
            bye"
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          PORT: ${{ secrets.SERVER_PORT }}
          USER: ${{ secrets.SERVER_USERNAME }}
          PASS: ${{ secrets.SERVER_PASSWORD }}
